# Disposable PostgreSQL for tests only. The application uses DATABASE_URL for Neon.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pcb_test
      POSTGRES_PASSWORD: pcb-test-only-password
      POSTGRES_DB: pcb_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcb_test -d pcb_test"]
      interval: 2s
      timeout: 3s
      retries: 20
