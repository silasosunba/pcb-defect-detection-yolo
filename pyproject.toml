[project]
name = "pcb-inspect"
version = "0.1.0"
description = "PCB defect inspection with React, FastAPI and fine-tuned YOLO"
requires-python = ">=3.10,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "pillow>=11,<13",
  "python-dotenv>=1,<2",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
inference = ["ultralytics==8.3.253"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "nbformat>=5,<6", "pyyaml>=6,<7", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
quote-style = "double"
