name: Application checks
on: [push, pull_request]
jobs:
  api-and-training:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pcb_test
          POSTGRES_PASSWORD: pcb-test-only-password
          POSTGRES_DB: pcb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pcb_test -d pcb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://pcb_test:pcb-test-only-password@127.0.0.1:5432/pcb_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.10
      - run: uv run python scripts/format_code.py --check
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
